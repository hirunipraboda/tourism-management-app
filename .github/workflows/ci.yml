name: CI Pipeline

on:
  push:
    branches: [ main, UI-design ]
  pull_request:
    branches: [ main ]

jobs:
  backend-net:
    name: Backend Build & Test (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/Nova.sln

      - name: Build solution
        run: dotnet build backend/Nova.sln --no-restore --configuration Release

      - name: Run xUnit Tests
        run: dotnet test backend/Nova.sln --no-build --configuration Release --verbosity normal

  frontend-react:
    name: Frontend Build & Test (React Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build React Application
        run: npm run build --prefix frontend

  mobile-flutter:
    name: Mobile App Validation (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: mobile

      - name: Analyze Flutter Code
        run: flutter analyze --no-fatal-infos
        working-directory: mobile
