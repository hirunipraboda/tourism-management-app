<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2636"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>

    <!-- Bot Body Metallic Gradient -->
    <linearGradient id="botBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Teal/Emerald Accent Gradient -->
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Orange/Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Dark Metal/Joints Gradient -->
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen Glass Gradient -->
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Cyan Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Map Graphic Pattern Gradient -->
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- Tech Grid Background Pattern (Subtle) -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="800" height="800" fill="url(#grid)"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="730" rx="180" ry="25" fill="#000000" opacity="0.5" filter="url(#glowSoft)"/>

  <!-- BOT GROUP -->
  <g id="travel-bot" transform="translate(0, -10)">

    <!-- BACKPACK (Travel Gear) -->
    <g id="backpack" filter="url(#shadow)">
      <rect x="280" y="330" width="240" height="200" rx="35" fill="url(#goldAccent)"/>
      <!-- Backpack Pocket -->
      <rect x="310" y="420" width="180" height="90" rx="20" fill="#b45309" opacity="0.8"/>
      <!-- Straps/Details -->
      <rect x="300" y="350" width="25" height="130" rx="10" fill="#78350f"/>
      <rect x="475" y="350" width="25" height="130" rx="10" fill="#78350f"/>
      <!-- Rolled Sleeping Bag / Mat on Top -->
      <rect x="260" y="300" width="280" height="45" rx="20" fill="url(#tealAccent)"/>
      <line x1="320" y1="300" x2="320" y2="345" stroke="#0f766e" stroke-width="4"/>
      <line x1="480" y1="300" x2="480" y2="345" stroke="#0f766e" stroke-width="4"/>
    </g>

    <!-- LEFT ARM (Holding Compass) -->
    <g id="left-arm">
      <!-- Shoulder -->
      <circle cx="260" cy="350" r="28" fill="url(#darkMetal)"/>
      <circle cx="260" cy="350" r="15" fill="url(#tealAccent)"/>
      <!-- Arm Segment -->
      <path d="M 250 365 Q 200 420 220 480" fill="none" stroke="url(#darkMetal)" stroke-width="28" stroke-linecap="round"/>
      <path d="M 250 365 Q 200 420 220 480" fill="none" stroke="url(#botBody)" stroke-width="16" stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="220" cy="490" r="18" fill="url(#darkMetal)"/>

      <!-- COMPASS -->
      <g id="compass" transform="translate(190, 480)" filter="url(#shadow)">
        <circle cx="0" cy="0" r="32" fill="url(#goldAccent)"/>
        <circle cx="0" cy="0" r="26" fill="#0f172a"/>
        <!-- Compass Dial Markings -->
        <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 6"/>
        <!-- Needle -->
        <polygon points="0,-18 6,0 0,4 -6,0" fill="#ef4444"/>
        <polygon points="0,18 6,0 0,-4 -6,0" fill="#cbd5e1"/>
        <circle cx="0" cy="0" r="4" fill="#ffffff"/>
        <!-- Compass Glass Glare -->
        <path d="M -18 -10 A 22 22 0 0 1 10 -18 Z" fill="#ffffff" opacity="0.3"/>
      </g>
    </g>

    <!-- RIGHT ARM (Waving / Pointing) -->
    <g id="right-arm">
      <!-- Shoulder -->
      <circle cx="540" cy="350" r="28" fill="url(#darkMetal)"/>
      <circle cx="540" cy="350" r="15" fill="url(#tealAccent)"/>
      <!-- Arm Segment (Raised Hand) -->
      <path d="M 550 365 Q 610 400 590 470" fill="none" stroke="url(#darkMetal)" stroke-width="28" stroke-linecap="round"/>
      <path d="M 550 365 Q 610 400 590 470" fill="none" stroke="url(#botBody)" stroke-width="16" stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="585" cy="480" r="18" fill="url(#darkMetal)"/>
    </g>

    <!-- TORSO / BODY -->
    <g id="torso" filter="url(#shadow)">
      <!-- Main Body Chassis -->
      <rect x="280" y="310" width="240" height="220" rx="60" fill="url(#botBody)"/>

      <!-- Outer Contour Highlight -->
      <rect x="284" y="314" width="232" height="212" rx="56" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>

      <!-- Chest Screen / Dashboard -->
      <rect x="310" y="340" width="180" height="150" rx="30" fill="url(#screenGlass)"/>
      <rect x="312" y="342" width="176" height="146" rx="28" fill="none" stroke="url(#tealAccent)" stroke-width="2" opacity="0.8"/>

      <!-- SCREEN CONTENT: Interactive Map UI -->
      <g id="screen-ui" filter="url(#glowCyan)">
        <!-- Holographic Map Lines -->
        <path d="M 330 420 Q 360 390 400 430 T 470 380" fill="none" stroke="#14b8a6" stroke-width="3" stroke-dasharray="4 4"/>
        <!-- Dotted Route -->
        <path d="M 340 450 Q 380 460 420 410 T 450 440" fill="none" stroke="#f59e0b" stroke-width="3"/>

        <!-- Map Location Pins on Chest Screen -->
        <g transform="translate(400, 430)">
          <path d="M 0 0 C -4 -4 -6 -8 -6 -11 A 6 6 0 1 1 6 -11 C 6 -8 4 -4 0 0 Z" fill="#ef4444"/>
          <circle cx="0" cy="-11" r="2.5" fill="#ffffff"/>
        </g>
        <g transform="translate(470, 380)">
          <path d="M 0 0 C -4 -4 -6 -8 -6 -11 A 6 6 0 1 1 6 -11 C 6 -8 4 -4 0 0 Z" fill="#22c55e"/>
          <circle cx="0" cy="-11" r="2.5" fill="#ffffff"/>
        </g>

        <!-- UI Elements / Stats -->
        <rect x="330" y="360" width="40" height="6" rx="3" fill="#38bdf8" opacity="0.8"/>
        <rect x="330" y="372" width="25" height="6" rx="3" fill="#38bdf8" opacity="0.5"/>

        <!-- Small Globe Grid Icon -->
        <circle cx="450" cy="365" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
        <ellipse cx="450" cy="365" rx="10" ry="4" fill="none" stroke="#38bdf8" stroke-width="1"/>
        <line x1="450" y1="355" x2="450" y2="375" stroke="#38bdf8" stroke-width="1"/>
      </g>

      <!-- Body Seams / Tech Details -->
      <path d="M 340 500 L 460 500" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- LEGS / LOWER BODY -->
    <g id="legs">
      <!-- Hip Joint -->
      <rect x="350" y="520" width="100" height="30" rx="10" fill="url(#darkMetal)"/>

      <!-- Left Leg -->
      <g id="left-leg">
        <rect x="345" y="540" width="40" height="110" rx="20" fill="url(#botBody)"/>
        <rect x="355" y="560" width="20" height="40" rx="10" fill="url(#darkMetal)"/>
        <!-- Boot / Base -->
        <path d="M 330 640 L 390 640 C 395 640 400 645 400 650 L 400 670 C 400 680 390 685 380 685 L 330 685 C 320 685 315 675 320 665 L 325 645 C 327 642 328 640 330 640 Z" fill="url(#darkMetal)"/>
        <rect x="325" y="670" width="70" height="10" rx="5" fill="url(#tealAccent)"/>
      </g>

      <!-- Right Leg -->
      <g id="right-leg">
        <rect x="415" y="540" width="40" height="110" rx="20" fill="url(#botBody)"/>
        <rect x="425" y="560" width="20" height="40" rx="10" fill="url(#darkMetal)"/>
        <!-- Boot / Base -->
        <path d="M 470 640 L 410 640 C 405 640 400 645 400 650 L 400 670 C 400 680 410 685 420 685 L 470 685 C 480 685 485 675 480 665 L 475 645 C 473 642 472 640 470 640 Z" fill="url(#darkMetal)"/>
        <rect x="405" y="670" width="70" height="10" rx="5" fill="url(#tealAccent)"/>
      </g>
    </g>

    <!-- HEAD & NECK -->
    <g id="head-group" filter="url(#shadow)">
      <!-- Neck -->
      <rect x="370" y="280" width="60" height="40" rx="10" fill="url(#darkMetal)"/>
      <path d="M 380 295 L 420 295" stroke="#2dd4bf" stroke-width="3" filter="url(#glowCyan)"/>

      <!-- Main Head Capsule -->
      <rect x="270" y="130" width="260" height="170" rx="75" fill="url(#botBody)"/>
      <!-- Inner Head Highlight -->
      <rect x="274" y="134" width="252" height="162" rx="71" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>

      <!-- Visor / Face Screen -->
      <rect x="295" y="150" width="210" height="120" rx="50" fill="url(#screenGlass)"/>
      <rect x="297" y="152" width="206" height="116" rx="48" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>

      <!-- EYES (Friendly Glowing Cyan Expressive LEDs) -->
      <g id="eyes" filter="url(#glowCyan)">
        <!-- Left Eye -->
        <ellipse cx="350" cy="205" rx="25" ry="30" fill="#2dd4bf"/>
        <ellipse cx="355" cy="200" rx="8" ry="12" fill="#ffffff"/>
        <!-- Right Eye -->
        <ellipse cx="450" cy="205" rx="25" ry="30" fill="#2dd4bf"/>
        <ellipse cx="455" cy="200" rx="8" ry="12" fill="#ffffff"/>
      </g>

      <!-- Happy Curved Mouth/Line -->
      <path d="M 385 240 Q 400 250 415 240" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" filter="url(#glowCyan)"/>

      <!-- Head Side Headphones / Antenna Mounts -->
      <!-- Left Ear -->
      <rect x="250" y="175" width="25" height="80" rx="10" fill="url(#darkMetal)"/>
      <rect x="260" y="190" width="10" height="50" rx="5" fill="url(#tealAccent)"/>
      <!-- Right Ear -->
      <rect x="525" y="175" width="25" height="80" rx="10" fill="url(#darkMetal)"/>
      <rect x="530" y="190" width="10" height="50" rx="5" fill="url(#tealAccent)"/>

      <!-- ANTENNA / TRAVEL MAP PIN -->
      <g id="antenna">
        <rect x="393" y="80" width="14" height="55" fill="url(#darkMetal)"/>
        <!-- Glowing Map Pin top instead of a simple ball -->
        <g transform="translate(400, 75)" filter="url(#glowCyan)">
          <path d="M 0 -25 C -12 -25 -20 -17 -20 -5 C -20 10 0 30 0 30 C 0 30 20 10 20 -5 C 20 -17 12 -25 0 -25 Z" fill="url(#tealAccent)"/>
          <circle cx="0" cy="-7" r="7" fill="#ffffff"/>
        </g>
      </g>

      <!-- EXPLORER HAT / SAFARI HELMET -->
      <g id="hat" filter="url(#shadow)">
        <!-- Hat Dome -->
        <path d="M 300 145 C 300 70 500 70 500 145 Z" fill="url(#goldAccent)"/>
        <!-- Hat Brim -->
        <path d="M 240 145 C 240 135 270 130 400 130 C 530 130 560 135 560 145 C 560 158 520 162 400 162 C 280 162 240 158 240 145 Z" fill="#d97706"/>
        <path d="M 255 145 C 255 140 280 135 400 135 C 520 135 545 140 545 145 C 545 152 510 156 400 156 C 290 156 255 152 255 145 Z" fill="#f59e0b"/>
        <!-- Hat Ribbon / Band -->
        <path d="M 301 140 C 330 133 470 133 499 140 L 497 128 C 450 120 350 120 303 128 Z" fill="#0f766e"/>
        <!-- Compass Badge on Hat -->
        <circle cx="400" cy="115" r="10" fill="url(#botBody)"/>
        <polygon points="400,107 403,115 400,113 397,115" fill="#ef4444"/>
        <polygon points="400,123 403,115 400,117 397,115" fill="#475569"/>
      </g>
    </g>

    <!-- FLOATING HOLOGRAPHIC MAP / ROUTE (Interactive Vibe) -->
    <g id="hologram-paper" transform="translate(560, 360) rotate(-10)" filter="url(#glowCyan)">
      <!-- Floating Map Document Base -->
      <rect x="0" y="0" width="130" height="170" rx="12" fill="#0f172a" opacity="0.85" stroke="#2dd4bf" stroke-width="2"/>

      <!-- Map Lines & Terrain Render -->
      <path d="M 15 30 Q 40 50 20 80 T 50 130" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
      <path d="M 60 20 Q 90 60 70 100 T 110 150" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>

      <!-- Dotted Travel Route -->
      <path d="M 25 140 Q 30 70 75 70 T 100 30" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4 4"/>

      <!-- Destination Waypoints -->
      <circle cx="25" cy="140" r="5" fill="#22c55e"/>
      <circle cx="100" cy="30" r="6" fill="#ef4444"/>
      <circle cx="100" cy="30" r="10" fill="none" stroke="#ef4444" stroke-width="1.5"/>

      <!-- Mini Search Icon / Location Tag -->
      <rect x="15" y="12" width="50" height="8" rx="4" fill="#38bdf8" opacity="0.7"/>

      <!-- Hologram Projection Beams (Connecting Hand to Map) -->
      <path d="M -30 110 L 0 20 L 0 150 Z" fill="url(#tealAccent)" opacity="0.15"/>
    </g>

    <!-- FLOATING ELEMENTS (Suitcase / Camera / Location Markers) -->

    <!-- Floating Location Pin (Left Side) -->
    <g transform="translate(140, 260) scale(0.8)" filter="url(#glowCyan)">
      <path d="M 0 0 C -12 -12 -18 -24 -18 -33 A 18 18 0 1 1 18 -33 C 18 -24 12 -12 0 0 Z" fill="#06b6d4"/>
      <circle cx="0" cy="-33" r="7" fill="#ffffff"/>
    </g>

    <!-- Floating Flight/Plane Icon (Right Side) -->
    <g transform="translate(660, 200) rotate(15) scale(0.9)" filter="url(#glowCyan)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <path d="M -10 5 L 12 -12 L 5 8 L 12 12 L 7 14 L 2 9 L -4 11 L -2 5 Z" fill="#38bdf8"/>
    </g>

    <!-- Decorative Tech Particles / Stars -->
    <g fill="#2dd4bf" filter="url(#glowCyan)">
      <circle cx="180" cy="180" r="3" opacity="0.8"/>
      <circle cx="230" cy="120" r="4" opacity="0.6"/>
      <circle cx="580" cy="120" r="2" opacity="0.9"/>
      <circle cx="640" cy="280" r="3.5" opacity="0.7"/>
      <circle cx="120" cy="420" r="2.5" opacity="0.5"/>
    </g>

  </g>
</svg>
